<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a washing machine, a basket of folded laundry and a delivery bag">
  <rect width="800" height="600" fill="#EEEEEE"/>
  <rect y="470" width="800" height="130" fill="#E2E2E2"/>
  <!-- washing machine -->
  <g transform="translate(120 150)">
    <rect width="250" height="320" rx="18" fill="#FFFFFF" stroke="#000" stroke-width="6"/>
    <line x1="0" y1="70" x2="250" y2="70" stroke="#000" stroke-width="6"/>
    <rect x="24" y="24" width="70" height="24" rx="6" fill="#E2E2E2"/>
    <circle cx="190" cy="36" r="13" fill="none" stroke="#000" stroke-width="5"/>
    <circle cx="222" cy="36" r="6" fill="#276EF1"/>
    <circle cx="125" cy="195" r="92" fill="#F6F6F6" stroke="#000" stroke-width="6"/>
    <circle cx="125" cy="195" r="66" fill="#EFF3FE" stroke="#000" stroke-width="4"/>
    <path d="M65 210 q30 -26 60 0 t60 0 v20 a66 66 0 0 1 -120 0z" fill="#276EF1" opacity=".85"/>
    <circle cx="100" cy="170" r="8" fill="#FFFFFF" stroke="#000" stroke-width="3"/>
    <circle cx="140" cy="158" r="5" fill="#FFFFFF" stroke="#000" stroke-width="3"/>
  </g>
  <!-- basket with folded laundry -->
  <g transform="translate(420 300)">
    <rect x="20" y="0" width="200" height="34" rx="6" fill="#FFFFFF" stroke="#000" stroke-width="5"/>
    <rect x="30" y="-32" width="180" height="34" rx="6" fill="#CBCBCB" stroke="#000" stroke-width="5"/>
    <rect x="40" y="-64" width="160" height="34" rx="6" fill="#FFFFFF" stroke="#000" stroke-width="5"/>
    <path d="M0 40 h240 l-22 130 h-196z" fill="#FFFFFF" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
    <path d="M30 80 h180 M36 115 h168 M42 150 h156" stroke="#AFAFAF" stroke-width="4"/>
  </g>
  <!-- delivery bag with location pin -->
  <g transform="translate(640 330)">
    <path d="M10 40 h100 l10 130 h-120z" fill="#000"/>
    <path d="M35 40 v-18 a25 25 0 0 1 50 0 v18" fill="none" stroke="#000" stroke-width="6"/>
    <path d="M60 78 a20 20 0 0 1 20 20 c0 16 -20 36 -20 36 s-20 -20 -20 -36 a20 20 0 0 1 20 -20z" fill="#FFFFFF"/>
    <circle cx="60" cy="98" r="7" fill="#000"/>
  </g>
</svg>
